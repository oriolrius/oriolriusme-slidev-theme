name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secrets, hygiene and Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks, commitizen and pre-commit
        run: |
          python3 -m venv /tmp/tools
          /tmp/tools/bin/pip install --disable-pip-version-check commitizen==4.13.9 pre-commit==4.5.1
          archive=/tmp/gitleaks.tar.gz
          curl --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C /tmp/tools/bin gitleaks
          echo /tmp/tools/bin >> "$GITHUB_PATH"
      - name: Gitleaks (full history and working tree)
        run: |
          gitleaks git --log-opts=--all --redact
          gitleaks dir --redact .
      - name: File hygiene and private keys
        run: SKIP=gitleaks-staged,gitleaks-history,commitizen pre-commit run --all-files --show-diff-on-failure
      - name: Conventional Commits
        run: cz check --rev-range HEAD

  showcase:
    name: Build the showcase and run the acceptance probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright-core install --with-deps chromium
      - run: pnpm probe

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [scan, showcase]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '$0 ~ "^## " tag {p=1; next} p && /^## /{exit} p' CHANGELOG.md > /tmp/notes.md
          [ -s /tmp/notes.md ] || echo "Release ${GITHUB_REF_NAME}" > /tmp/notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --verify-tag
